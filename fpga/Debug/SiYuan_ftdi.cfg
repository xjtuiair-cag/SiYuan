#
# Genesys2 FT2232H channel 0 → RISC-V debug (FPGA user JTAG pins)
# Compatible with OpenOCD 0.12+ (set_prefer_sba was removed).
# Close Vivado hw_server / Adept before use. Bitstream must be programmed.
#

adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0

# Bit0 TCK, Bit1 TDI, Bit2 TDO(in), Bit3 TMS, Bit4 nTRST
ftdi layout_init 0x0018 0x001b
ftdi layout_signal nTRST -ndata 0x0010

adapter speed 500
transport select jtag

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x00000001

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME -coreid 0

gdb report_data_abort enable
gdb report_register_access_error enable

riscv set_command_timeout_sec 120

# Old: "riscv set_prefer_sba off"  —— removed in recent OpenOCD
# Equivalent: prefer progbuf/abstract over system-bus access
riscv set_mem_access progbuf abstract sysbus

init
halt
echo "Ready for Remote Connections"
