interface remote_bitbang
remote_bitbang_port 40203

transport select jtag

# 这里定义一个 TAP（DUT 里的 IR 长度你需要改成真实值）
set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5

# target create $_CHIPNAME.cpu riscv -chain-position $_CHIPNAME.cpu -rtos riscv
target create riscv.cpu0 riscv -chain-position riscv.cpu -coreid 0
target create riscv.cpu1 riscv -chain-position riscv.cpu -coreid 1
